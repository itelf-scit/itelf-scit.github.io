<svg viewBox="0 0 1400 800" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="titleId descId" preserveAspectRatio="xMidYMid meet" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="titleId">Paper plane taking flight</title>
  <desc id="descId">A white paper plane rises along a curling dashed trajectory against a transparent background, looping gently.</desc>

  <defs>
    <linearGradient id="trajGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7FD8EC" stop-opacity="0.45" />
      <stop offset="55%" stop-color="#BFE7F2" stop-opacity="0.65" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.9" />
    </linearGradient>

    <mask id="trajMask" maskUnits="userSpaceOnUse" x="0" y="0" width="1400" height="800">
      <path class="reveal" pathLength="1"
            d="M 55,725 C 226.2,694.7 311.9,644.2 365.2,593.8 C 408.2,553.4 401.8,472.7 344.0,462.6 C 286.2,454.5 258.4,523.1 311.9,553.4 C 354.7,577.6 408.2,553.4 429.6,513.0 C 472.4,432.3 568.7,371.7 675.8,311.2 C 825.6,226.4 975.4,190.1 1103.9,139.6 C 1200.1,101.2 1275.1,89.1 1350.0,75.0"
            fill="none" stroke="#FFFFFF" stroke-width="44" stroke-linecap="round"
            stroke-dasharray="1 1" stroke-dashoffset="1" />
    </mask>
  </defs>

  <style>
    .scene { animation: fadeOnce 0.9s ease-out 1 forwards; }

    .reveal { animation: drawOnce 4.2s linear 1 forwards; }

    .trajectory {
      fill: none;
      stroke: url(#trajGrad);
      stroke-width: 4.8;
      stroke-linecap: round;
      stroke-dasharray: 14 18;
      mask: url(#trajMask);
    }

    .plane-group {
      offset-path: path("M 55,725 C 226.2,694.7 311.9,644.2 365.2,593.8 C 408.2,553.4 401.8,472.7 344.0,462.6 C 286.2,454.5 258.4,523.1 311.9,553.4 C 354.7,577.6 408.2,553.4 429.6,513.0 C 472.4,432.3 568.7,371.7 675.8,311.2 C 825.6,226.4 975.4,190.1 1103.9,139.6 C 1200.1,101.2 1275.1,89.1 1350.0,75.0");
      offset-rotate: auto;
      offset-distance: 0%;
      animation: flyOnce 6s cubic-bezier(.22,1,.36,1) 1 forwards;
      will-change: offset-distance;
    }

    .plane-settle {
      animation: settleOnce 6s ease-in-out 1 forwards;
      transform-box: fill-box;
      transform-origin: 55% 50%;
    }

    .plane-top { fill: #FAFBFD; }
    .plane-bottom { fill: #C3D3E7; }
    .plane-crease { stroke: #9FB2CC; stroke-width: 0.7; stroke-linecap: round; opacity: 0.6; }

    @keyframes fadeOnce {
      0%   { opacity: 0; }
      100% { opacity: 1; }
    }

    @keyframes drawOnce {
      0%   { stroke-dashoffset: 1; }
      100% { stroke-dashoffset: 0; }
    }

    @keyframes flyOnce {
      0%   { offset-distance: 0%; }
      100% { offset-distance: 100%; }
    }

    @keyframes settleOnce {
      0%   { transform: scale(1, 1); }
      82%  { transform: scale(1, 1); }
      87%  { transform: scale(1.05, 0.95); }
      92%  { transform: scale(0.97, 1.03); }
      100% { transform: scale(1, 1); }
    }

    @media (prefers-reduced-motion: reduce) {
      .scene, .reveal, .plane-group, .plane-settle {
        animation: none !important;
      }
      .scene { opacity: 1; }
      .reveal { stroke-dashoffset: 0; }
      .plane-group { offset-distance: 100%; }
      .plane-settle { transform: scale(1, 1); }
    }
  </style>

  <g class="scene">
    <path class="trajectory"
          d="M 55,725 C 226.2,694.7 311.9,644.2 365.2,593.8 C 408.2,553.4 401.8,472.7 344.0,462.6 C 286.2,454.5 258.4,523.1 311.9,553.4 C 354.7,577.6 408.2,553.4 429.6,513.0 C 472.4,432.3 568.7,371.7 675.8,311.2 C 825.6,226.4 975.4,190.1 1103.9,139.6 C 1200.1,101.2 1275.1,89.1 1350.0,75.0" />

    <g class="plane-group">
      <g transform="scale(2.05)">
        <g class="plane-settle">
          <path class="plane-top" d="M 23,0 L -20,-12 L -4,0 Z" />
          <path class="plane-bottom" d="M 23,0 L -4,0 L -20,12 Z" />
          <path class="plane-crease" d="M 23,0 L -4,0" fill="none" />
        </g>
      </g>
    </g>
  </g>
</svg>
